# Calls raulahumada/security-jev (product).
# Secret on THIS repo: TYPESAFE_API_KEY (BYO mode today)
# Blocking: fail_on_findings true + require check "PR Security Gate" on main

name: PR Security Gate

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  call-security-jev:
    name: Jev review
    uses: raulahumada/security-jev/.github/workflows/pr-security-gate.yml@main
    with:
      # Block merge when security rules fire (still need branch protection).
      fail_on_findings: ${{ vars.FAIL_ON_FINDINGS || 'true' }}
    secrets:
      TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
